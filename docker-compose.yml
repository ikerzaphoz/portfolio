name: portfolio

services:
  app:
    image: ghcr.io/ikerzaphoz/portfolio:latest
    # build: .          # descomenta para construir la imagen localmente en el VPS
    restart: unless-stopped
    environment:
      # .env junto a docker-compose.yml en el VPS: APP_KEY=base64:...
      APP_KEY: ${APP_KEY:?APP_KEY requerido en .env del VPS (ver DEPLOY.md)}
    volumes:
      - app-database:/var/www/html/database
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-ikerzaphoz.dev}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-database:
  app-storage:
  caddy-data:
  caddy-config:
